<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LCSC Purchase</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/32.png" alt=""><div><h1>BOM Inventory</h1><small>LCSC → Purchase</small></div></header>
<details><summary>Local API settings</summary><label>HTTP address<input id="address" placeholder="http://127.0.0.1"></label><label>Port<input id="port" type="number" min="1" max="65535" value="8080"></label><button id="connect">Save & load projects</button></details>
<button id="scrape">Read current LCSC product</button>
<form id="purchase"><img id="preview" alt="Part photo" hidden><div id="fields"></div><label>Image URL<input id="image" type="url"></label><label>Purchase quantity<input id="quantity" type="number" min="1" step="1" value="1" required></label><fieldset><legend>Allocate to projects</legend><small>Each checked project needs a quantity. Total cannot exceed purchase quantity.</small><div id="projects">Connect to load projects.</div></fieldset><footer><p id="status" role="status" aria-live="polite"></p><button id="submit" type="submit" disabled>Add to Purchase</button></footer></form><script src="scrape.js"></script><script src="popup.js"></script></body></html>
